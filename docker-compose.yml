services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: reserva-api
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    depends_on:
      - mongo
    networks:
      - reserva_net

  mongo:
    image: mongo:7
    container_name: reserva-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - reserva_net

  mongo-express:
    image: mongo-express
    container_name: reserva-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: mongoexpressuser
      ME_CONFIG_BASICAUTH_PASSWORD: mongoexpresspass
    depends_on:
      - mongo
    networks:
      - reserva_net

volumes:
  mongo_data:

networks:
  reserva_net:
    driver: bridge
