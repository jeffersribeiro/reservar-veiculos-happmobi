<div class="screen">
  <header class="top">
    <div class="title-area">
      <div class="title">Ajuda & Contatos</div>
      <div class="sub">Tire dúvidas, encontre suporte e atalhos rápidos</div>
    </div>
  </header>

  <section class="quick">
    <button class="quick-card" type="button" (click)="startChat()">
      <div class="qc-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 4h16v11H7.5L4 18.5V4Zm4 5h8v2H8V9Zm0-3h12v2H8V6Z"
            fill="currentColor"
          />
        </svg>
      </div>
      <div class="qc-text">
        <div class="qc-title">Falar no chat</div>
        <div class="qc-sub">Atendimento rápido</div>
      </div>
      <span class="qc-arrow">›</span>
    </button>

    <button class="quick-card" type="button" (click)="reportIssue()">
      <div class="qc-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2 1 21h22L12 2Zm1 14h-2V9h2v7Zm0 4h-2v-2h2v2Z"
            fill="currentColor"
          />
        </svg>
      </div>
      <div class="qc-text">
        <div class="qc-title">Reportar problema</div>
        <div class="qc-sub">Erro, pagamento, reserva</div>
      </div>
      <span class="qc-arrow">›</span>
    </button>

    <button class="quick-card" type="button" (click)="viewPolicies()">
      <div class="qc-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M6 2h9l5 5v15a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm8 1v5h5"
            fill="currentColor"
          />
        </svg>
      </div>
      <div class="qc-text">
        <div class="qc-title">Políticas</div>
        <div class="qc-sub">Regras e termos</div>
      </div>
      <span class="qc-arrow">›</span>
    </button>
  </section>

  <section class="card">
    <div class="card-title">Dúvidas frequentes</div>

    <div class="faq">
      <div class="faq-item" *ngFor="let item of faq">
        <button class="faq-q" type="button" (click)="toggleFaq(item)">
          <span>{{ item.q }}</span>
          <span class="chev" [class.open]="item.open">⌄</span>
        </button>

        <div class="faq-a" *ngIf="item.open">
          {{ item.a }}
        </div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-title">Contatos</div>

    <div class="contacts">
      <div class="contact" *ngFor="let c of contacts">
        <div class="c-icon" aria-hidden="true">
          <ng-container [ngSwitch]="c.icon">
            <svg *ngSwitchCase="'whatsapp'" viewBox="0 0 24 24">
              <path
                d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20Zm4.6-5.5c-.2-.1-1.2-.6-1.4-.7-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-1.2-.6-2.2-1.4-3-2.5-.1-.2 0-.4.1-.5l.6-.7c.1-.2.2-.3.1-.5l-.6-1.4c-.1-.2-.2-.3-.4-.3h-.5c-.2 0-.4.1-.6.3-.6.7-.9 1.6-.9 2.5 0 .3.1.6.2.9.7 1.6 1.9 3.1 3.4 4.2 1.2.9 2.5 1.5 3.9 1.7.5.1 1 .1 1.5 0 .5-.1 1.6-.7 1.8-1.4.2-.6.2-1.1.1-1.2-.1-.2-.2-.2-.4-.3Z"
                fill="currentColor"
              />
            </svg>

            <svg *ngSwitchCase="'phone'" viewBox="0 0 24 24">
              <path
                d="M6.6 10.8c1.3 2.7 3.8 5.2 6.5 6.5l2.2-2.2c.3-.3.8-.4 1.2-.2 1 .4 2.1.6 3.2.6.6 0 1 .4 1 1V21c0 .6-.4 1-1 1C10.8 22 2 13.2 2 2c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.1.2 2.2.6 3.2.1.4 0 .9-.2 1.2L6.6 10.8Z"
                fill="currentColor"
              />
            </svg>

            <svg *ngSwitchCase="'email'" viewBox="0 0 24 24">
              <path
                d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5L4 8V6l8 5 8-5v2Z"
                fill="currentColor"
              />
            </svg>

            <svg *ngSwitchCase="'location'" viewBox="0 0 24 24">
              <path
                d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"
                fill="currentColor"
              />
            </svg>
          </ng-container>
        </div>

        <div class="c-text">
          <div class="c-label">{{ c.label }}</div>
          <div class="c-value">{{ c.value }}</div>
          <div class="c-hint" *ngIf="c.hint">{{ c.hint }}</div>
        </div>

        <button class="c-action" type="button" aria-label="Ação">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M14 3h7v7h-2V6.4l-8.3 8.3-1.4-1.4L17.6 5H14V3ZM5 5h7v2H7v10h10v-5h2v7H5V5Z"
              fill="currentColor"
            />
          </svg>
        </button>
      </div>
    </div>
  </section>

  <nav class="tabs" aria-label="Bottom tabs">
    <button
      class="tab"
      type="button"
      [class.active]="activeTab === 'home'"
      (click)="setTab('home')"
    >
      <span class="t-icon">⌂</span>
      <span class="t-label">Home</span>
    </button>

    <button
      class="tab"
      type="button"
      [class.active]="activeTab === 'bookings'"
      (click)="setTab('bookings')"
    >
      <span class="t-icon">🗓</span>
      <span class="t-label">Reservas</span>
    </button>

    <button
      class="tab"
      type="button"
      [class.active]="activeTab === 'help'"
      (click)="setTab('help')"
    >
      <span class="t-icon">?</span>
      <span class="t-label">Ajuda</span>
    </button>

    <button
      class="tab"
      type="button"
      [class.active]="activeTab === 'profile'"
      (click)="setTab('profile')"
    >
      <span class="t-icon">👤</span>
      <span class="t-label">Perfil</span>
    </button>
  </nav>
</div>
