<div class="vehicles-screen">
  <ng-container *ngIf="groupedVehicles$ | async as groups; else loading">
    <div *ngIf="groups.length === 0" class="empty">
      <div class="p">Não foram encontrados carros com os filtros aplicados</div>
    </div>

    <section class="groups" *ngIf="groups.length > 0">
      <section class="group" *ngFor="let g of groups; trackBy: trackGroup">
        <div class="group-header">
          <h2 class="group-title">{{ g.category }}</h2>
          <span class="group-count">{{ g.vehicles.length }}</span>
        </div>

        <div class="grid">
          <article
            class="card"
            *ngFor="let v of g.vehicles; trackBy: trackVehicle"
          >
            <app-vehicle-card
              (details)="openDetails($event)"
              [vm]="v"
            ></app-vehicle-card>
          </article>
        </div>
      </section>
    </section>
  </ng-container>

  <ng-template #loading>
    <div class="skeleton-grid">
      <div class="skeleton" *ngFor="let _ of [1, 2, 3, 4, 5, 6]"></div>
    </div>
  </ng-template>
</div>
